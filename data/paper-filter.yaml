# LLM 추론 최적화 논문 선별 규칙
#
# 어휘집은 두 곳에서 뽑았다.
#   - 이 블로그가 2025~2026 에 리뷰한 arXiv 논문 149 편의 제목 n-gram
#   - MLSys 2023~2025 채택 논문 144 편의 제목 n-gram
# MLSys 는 federated learning / GNN / 클러스터 스케줄링 비중이 커서 통째로
# 넣지 않고 LLM 추론과 겹치는 축만 가져왔다.
#
# 점수: (0.55*topic + 0.25*buzz + 0.12*impl + 0.08*venue) * category_mult
# 자세한 정의는 docs/superpowers/specs/2026-09-06-paper-pipeline-design.md

version: 1

weights:
  topic: 0.55
  buzz: 0.25
  impl: 0.12
  venue: 0.08

field_weights:
  title: 2.0
  keywords: 1.5
  abstract: 1.0

# raw 점수를 1-exp(-raw/k) 로 포화시킨다. 작을수록 빨리 1 에 붙는다.
saturation_k: 6.0
# buzz 는 문턱 위에서만 선형으로 오른다. log 곡선은 저구간이 너무 후해서
# (upvote 2 개 = 최대치의 22%) 관련 없는 인기 논문이 표적 논문을 밀어냈다.
buzz_floor: 10        # 이 아래는 신호로 안 친다 (저자 + 지인 수준)
buzz_reference: 150   # 이 upvote 수부터 buzz 1.0
stars_reference: 500

gates:
  hf_min_score: 0.45        # HF 에 올라온 논문의 총점 기준
  min_substantive_hits: 1   # core/named_systems/systems 에서 최소 몇 개나 걸려야 하는지.
                            # 인기(upvote)나 약한 용어 누적이 주제 관련성을
                            # 대신하지 못하게 막는다.
  arxiv_min_topic: 0.70     # arXiv 단독 — buzz 가 0 이라 토픽만 본다
  arxiv_min_core_hits: 2
  top_k: 2                  # 한 번에 만들 초안 상한 (매일 cron → 평일 주 10편 상한)

preferred_categories: [cs.LG, cs.CL, cs.DC, cs.AR, cs.PF, cs.SE, cs.MS, cs.OS]
non_preferred_multiplier: 0.9

# 수집 대상 arXiv 카테고리 (preferred_categories 와 다른 목록이다.
# 이쪽은 "무엇을 긁어올까", 저쪽은 "무엇에 감점하지 않을까")
fetch_categories: [cs.LG, cs.CL, cs.DC, cs.AR, cs.PF]

# 실질 축. 여기서 하나도 안 걸리면 gates.min_substantive_hits 에 막힌다.
substantive_tiers: [core, named_systems, systems]

tiers:
  - name: core
    weight: 3.0
    terms:
      # 추론·서빙 고유 개념. 이게 걸리면 거의 확실히 관심 논문이다.
      - kv cache
      - key-value cache
      - kv compression
      - cache compression
      - kv eviction
      - cache eviction
      - prefix caching
      - prefix cache
      - speculative decoding
      - speculative sampling
      - paged attention
      - pagedattention
      - continuous batching
      - prefill
      - decode phase
      - decoding phase
      - ttft
      - tpot
      - time to first token
      - time per output token
      - llm serving
      - llm inference
      - inference serving
      - model serving
      - sparse attention
      - flash attention
      - flashattention
      - efficient inference
      - inference efficiency
      - disaggregated
      - disaggregation
      - slo

  - name: named_systems
    weight: 2.5
    terms:
      # 고유명사 자체가 강한 신호다.
      - vllm
      - sglang
      - flashinfer
      - tensorrt
      - qserve
      - lserve
      - xgrammar
      - deepspeed
      - sarathi
      - cutlass
      - triton

  - name: systems
    weight: 2.0
    terms:
      # MLSys 축. 2025 채택 논문에서 실제로 반복된 것들.
      - quantization
      - post-training quantization
      - w4a8
      - w4a16
      - w8a8
      - fp8
      - fp4
      - nvfp4
      - mxfp4
      - int4
      - int8
      - low-precision
      - offloading
      - cpu offload
      - attention kernel
      - attention engine
      - fused attention
      - context parallelism
      - pipeline parallelism
      - tensor parallelism
      - communication overlap
      - computation-communication
      - overlapping
      - scheduling
      - structured generation
      - resharding
      - gpu memory
      - on-device
      - edge llm
      - linear attention
      - state space model
      - state space duality
      - ssm
      - mamba
      - gpu sharing
      - multi-tenant
      - multitasking
      - compression
      - sparsity
      - pruning

  - name: adjacent
    weight: 1.5
    terms:
      - mixture-of-experts
      - moe
      - long context
      - throughput
      - latency
      - memory efficient
      - attention
      - distillation
      - batching
      - cache
      - kernel
      - decoding
      - autoregressive

  - name: weak
    weight: 0.5
    terms:
      - efficient
      - efficiency
      - scaling
      - transformer
      - llm
      - large language model
      - acceleration
      - optimization

# 제목에 있고 core 용어가 하나도 없을 때만 제외한다.
# 조건부인 이유: 'Radial Attention ... for Long Video Generation' 처럼
# 도메인은 비디오지만 sparse attention 이 본체인 논문을 살리기 위해서다.
exclude_terms:
  - text-to-image
  - image generation
  - video generation
  - protein
  - molecule
  - drug discovery
  - recommendation
  - federated learning
  - autonomous driving
  - robot
  - speech synthesis
  - medical imaging
  - time series
  - graph neural network

# venue 항 화이트리스트. 소문자 부분 일치.
organizations:
  - deepseek
  - qwen
  - alibaba
  - moonshot
  - zhipu
  - bytedance
  - nvidia
  - microsoft
  - google
  - deepmind
  - meta
  - tsinghua
  - berkeley
  - stanford
  - carnegie mellon
  - lmsys
  - hazy research
  - han lab

summarize:
  model: opencode-go/deepseek-v4-pro
  # 1차가 실패하면(프로바이더 한도·장애) 여기로 넘어간다. 무료 모델이라
  # 그날 수집분을 통째로 버리는 것보다 낫다. 실제로 쓴 모델은 초안
  # 카테고리(with-…)에 남으니 나중에 구분된다.
  fallback_model: opencode/muse-spark-1.3-contributor-free
  variant: null           # opencode --variant 값. null 이면 생략한다.
  timeout_seconds: 900

translate:
  # 번역은 요약보다 쉬운 일이라 싼 모델로 충분하다. 실측 비용은 요약이
  # 편당 $0.008 남짓이었고 번역은 입력이 짧아 더 싸다.
  model: opencode-go/deepseek-v4-flash
  fallback_model: opencode/muse-spark-1.3-contributor-free
  variant: null
  timeout_seconds: 900

assets:
  # 논문 원문에서 표·그림을 뽑는 단계(summarize 앞에 돈다).
  max_figures: 4          # 편당 그림 상한. 저장 용량이 실질적 제약이다.
  max_tables: 8           # 편당 표 상한. 부록 표가 20개씩 있는 논문도 있다.

  # 그림을 다시 올릴 수 있는 라이선스. 좁게 잡은 이유:
  #  - arXiv 기본 라이선스는 arXiv 에게만 배포권을 준 것이다(실측 8편 중 5편).
  #  - 이 블로그는 static/ads.txt 에 AdSense ID 가 있어 상업적 이용이다 -> NC 불가.
  #  - ND 는 리사이즈가 변경에 해당할 수 있어 뺐다.
  #  - SA 는 그 의무가 글 전체로 번질 수 있어 뺐다.
  # 표는 이 목록과 무관하다 - 사실 데이터를 다시 표현하고 출처를 밝힌다.
  allowed_licenses:
    - creativecommons.org/licenses/by/
    - creativecommons.org/publicdomain/zero/
    - creativecommons.org/publicdomain/mark/
