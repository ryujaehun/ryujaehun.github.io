# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    # GitHub-hosted runners automatically enable `set -eo pipefail` for Bash shells.
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0
      HUGO_ENVIRONMENT: production
      TZ: Asia/Seoul
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # automation submodule 은 private 이라 기본 GITHUB_TOKEN 으로는
          # 체크아웃되지 않는다. Hugo 빌드는 그걸 읽지 않으므로 테마만
          # 따로 초기화한다.
          submodules: false
          fetch-depth: 0
      - name: Checkout theme submodule
        run: git submodule update --init themes/hugo-narrow
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Cache Restore
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/hugo_cache
          key: hugo-${{ github.run_id }}
          restore-keys: hugo-
      - name: Configure Git
        run: git config core.quotepath false
      - name: Build with Hugo
        run: |
          # --printPathWarnings 로 URL 이 겹치는 글을 잡는다. 겹치면 한쪽만
          # 게시되고 나머지는 조용히 덮여 사라진다(실측 2쌍). Hugo 는 이걸
          # 경고로만 알리고 종료 코드는 0 이라 직접 걸러 실패시킨다.
          hugo \
            --gc \
            --minify \
            --printPathWarnings \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/hugo_cache" 2>&1 | tee hugo-build.log
          if grep -q "Duplicate target paths" hugo-build.log; then
            echo "::error::URL 이 겹치는 글이 있습니다. 위 경고의 경로를 확인하세요."
            grep "Duplicate target paths" hugo-build.log
            exit 1
          fi
      - name: Cache Save
        id: cache-save
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/hugo_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
