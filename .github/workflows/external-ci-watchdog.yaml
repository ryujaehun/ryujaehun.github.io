name: External CI watchdog

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: external-ci-watchdog
  cancel-in-progress: false

jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Test observer failure and recovery paths
        run: python3 -m unittest discover -s scripts -p test_external_watchdog.py
      - name: Observe heartbeat and external HTTPS authentication boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/external_watchdog.py
