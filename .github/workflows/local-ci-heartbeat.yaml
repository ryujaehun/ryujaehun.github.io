name: Local CI heartbeat
run-name: "NAS heartbeat ${{ inputs.observed_at }}"

on:
  workflow_dispatch:
    inputs:
      observed_at:
        description: UTC time of validated monitor snapshot (no private data)
        required: true
        type: string

permissions:
  contents: none

concurrency:
  group: local-ci-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, local-ryujaehun.github.io]
    timeout-minutes: 2
    steps:
      - name: Record NAS runner liveness
        run: date -u '+Observed live NAS runner at %Y-%m-%dT%H:%M:%SZ'
